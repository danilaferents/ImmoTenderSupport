<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ImmoTender – Mobile Landing</title>
  <meta name="description" content="Find your dream flat in Berlin" />
  <meta name="theme-color" content="#0b0b0f" />

  <!-- iOS Smart App Banner (replace APP_STORE_ID) -->
  <meta name="apple-itunes-app" content="app-id=APP_STORE_ID"> 

  <!-- Open Graph (for social shares) -->
  <meta property="og:title" content="ImmoTender for iOS" />
  <meta property="og:description" content="Find your dream flat in Berlin" />
  <meta property="og:image" content="/path/to/app-icon.png" />

  <style>
    :root {
      --bg: #0b0b0f;            /* near-black */
      --card: #121319;          /* dark card */
      --text: #f2f4f8;          /* near white */
      --muted: #b7c0cc;
      --primary: #FFD12B;       /* yellow CTA */
      --primary-contrast: #111827; /* dark text on yellow */
      --radius: 24px;
      --shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; 
      background: radial-gradient(1200px 800px at 70% -10%, #1a1b24, #0b0b0f), var(--bg);
      color: var(--text); 
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display: grid; 
      place-items: center; 
    }

    .wrap { width: 100%; max-width: 720px; padding: 24px; }

    .store-header { display: flex; align-items: center; gap: 12px; opacity: .95; margin-bottom: 12px; }
    .store-header small { color: var(--muted); }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.0)), var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden; position: relative;
    }

    .hero { position: relative; padding: 28px 28px 18px; }
    .hero-bg {
      position: absolute; inset: 0; opacity: .18; background:
        radial-gradient(1000px 500px at 80% 20%, #3b82f6, transparent 60%),
        radial-gradient(900px 500px at 10% 90%, #8b5cf6, transparent 60%);
      pointer-events: none; filter: blur(40px);
    }

    .brand-row { display: flex; align-items: center; gap: 16px; }
    .icon {
      width: 88px; height: 88px; border-radius: 24px; flex: 0 0 auto;
      background: #111; display: grid; place-items: center; overflow: hidden; border: 1px solid rgba(255,255,255,.06);
    }
    .icon img { width: 100%; height: 100%; object-fit: cover; }

    h1 { font-size: clamp(28px, 4vw, 40px); margin: 0; letter-spacing: .2px; }
    .subtitle { color: var(--muted); margin: 8px 0 0 0; font-size: 18px; }

    .cta { padding: 28px; display: grid; gap: 14px; }
    .btn {
      display: inline-flex; justify-content: center; align-items: center; gap: 10px;
      width: 100%; padding: 14px 18px; border-radius: 16px; border: 1px solid rgba(255,255,255,.08);
      background: var(--primary); color: var(--primary-contrast); font-weight: 700; text-decoration: none;
      box-shadow: 0 8px 24px rgba(255,209,43,.40);
      transition: transform .08s ease, filter .2s ease, box-shadow .2s ease;
    }
    .btn:active { transform: translateY(1px); }

    /* Secondary buttons row */
    .btn-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 12px 16px; border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,0.04);
      color: var(--text); text-decoration: none; font-weight: 600;
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,.28); }
    .btn-secondary:active { transform: translateY(1px); }
    .btn-secondary svg { width: 18px; height: 18px; display: block; }

    footer { text-align: center; color: var(--muted); font-size: 14px; padding: 18px 0 4px; }

    .domain-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 12px #10b981; }

    @media (max-width: 420px) {
      .btn-row { grid-template-columns: 1fr; }
    }

    @media (prefers-color-scheme: light) {
      :root { --bg: #f6f7fb; --card: #ffffff; --text: #111827; --muted: #6b7280; }
      body { background: radial-gradient(1200px 800px at 70% -10%, #dbeafe, #f6f7fb); }
      .btn { box-shadow: 0 8px 24px rgba(255,209,43,.25); }
      .icon { border-color: rgba(0,0,0,.06); }
      .btn-secondary { border-color: rgba(0,0,0,.12); background: rgba(0,0,0,.03); }
      .btn-secondary:hover { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.22); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card" role="region" aria-label="App Landing">
      <div class="hero">
        <div class="hero-bg" aria-hidden="true"></div>

        <div class="brand-row">
          <div class="icon" aria-hidden="true">
            <!-- Replace with your 1024×1024 icon -->
            <img src="./Images/ImmoTender.png" alt="ImmoTender icon" />
          </div>
          <div>
            <h1>ImmoTender</h1>
            <p class="subtitle">Find your dream flat in Berlin</p>
          </div>
        </div>
      </div>

      <div class="cta">
        <!-- Primary CTA -->
        <a id="openAppBtn" class="btn" href="#">Continue in App</a>

        <!-- Secondary CTAs -->
        <div class="btn-row">
          <!-- Support email (replace SUPPORT_EMAIL if you have one) -->
          <a class="btn-secondary" 
             href="mailto:iambpev@gmail.com?subject=ImmoTender%20Support&body=Hi%20ImmoTender%20team%2C%0A%0AI%27m%20writing%20about%20...%0A%0AThanks!">
            <!-- Envelope icon -->
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.5" />
            </svg>
            Support
          </a>

          <!-- LinkedIn (replace LINKEDIN_URL) -->
          <a class="btn-secondary" href="https://www.linkedin.com/in/danila-ferents-73b592165/" target="_blank" rel="noopener">
            <!-- LinkedIn icon -->
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M4.98 3.5C4.98 4.88 3.86 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM0 8h5v16H0V8zm7.5 0h4.8v2.2h.07c.67-1.27 2.3-2.6 4.73-2.6 5.06 0 6 3.33 6 7.67V24h-5v-6.9c0-1.64-.03-3.74-2.28-3.74-2.28 0-2.63 1.78-2.63 3.62V24h-5V8z"/>
            </svg>
            LinkedIn
          </a>
        </div>
      </div>

      <footer>
        <span class="domain-pill"><span class="dot" aria-hidden="true"></span> <span id="domainLabel">immotender.danilaferents.com</span></span>
      </footer>
    </section>
  </div>

  <script>
    // ---- CONFIGURE THESE VALUES ----
    const CONFIG = {
      universalLink: 'UNIVERSAL_LINK',   // e.g. https://immotender.danilaferents.com/open
      customScheme: 'immotender://open', // fallback to app scheme (change to yours)
      appStoreURL: 'https://apps.apple.com/app/idAPP_STORE_ID',
      domainLabel: 'immotender.danilaferents.com'
    };

    // Set dynamic label
    const domainEl = document.getElementById('domainLabel');
    if (domainEl) domainEl.textContent = CONFIG.domainLabel;

    // Try to open the app; if it fails, fall back to App Store
    function openAppSmart() {
      const start = Date.now();
      const target = CONFIG.universalLink && CONFIG.universalLink !== 'UNIVERSAL_LINK'
        ? CONFIG.universalLink
        : CONFIG.customScheme;

      window.location.href = target;

      setTimeout(() => {
        const elapsed = Date.now() - start;
        if (elapsed < 1500) {
          window.location.href = CONFIG.appStoreURL;
        }
      }, 1000);
    }

    document.getElementById('openAppBtn').addEventListener('click', (e) => {
      e.preventDefault();
      openAppSmart();
    });

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    if (/android/i.test(ua)) {
      document.getElementById('openAppBtn').textContent = 'Open in App';
    }
  </script>
</body>
</html>
